[package]
name = "memhub-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MT-gar/MemHub"
description = "MemHub desktop app (Tauri 2)"

# Standalone crate on purpose: the root workspace (core + CLI) builds without any GUI system deps.
[workspace]

[lib]
name = "memhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memhub-core = { path = "../../../crates/memhub-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
