name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: ''
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '. -> target\napps/desktop/src-tauri -> target' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev

      - name: Install JS deps
        run: |
          npm ci --prefix ui
          npm ci --prefix apps/desktop

      - name: Build CLI sidecar
        shell: bash
        run: |
          cargo build --release -p memhub-cli --target ${{ matrix.target }}
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/${{ matrix.target }}/release/memhub$EXT apps/desktop/src-tauri/binaries/memhub-${{ matrix.target }}$EXT
          # standalone CLI archive
          mkdir -p dist-cli && cd dist-cli
          if [[ -n "$EXT" ]]; then
            7z a memhub-cli-${{ matrix.target }}.zip ../target/${{ matrix.target }}/release/memhub.exe
          else
            tar czf memhub-cli-${{ matrix.target }}.tar.gz -C ../target/${{ matrix.target }}/release memhub
          fi

      - name: Build & publish desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'MemHub ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details. macOS builds are unsigned: right-click → Open on first launch.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Upload CLI archive to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-cli/*
