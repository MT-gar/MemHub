name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MemHub version
      placeholder: "0.1.0 (desktop) / memhub --version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: agents
    attributes:
      label: Agents / sources involved
      placeholder: "Claude Code, Codex CLI, a generic folder, ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Output of the failing command, the sync error shown in the app, etc. **Remove anything private.**
      render: shell
